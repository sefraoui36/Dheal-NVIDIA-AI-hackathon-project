
services:
  - type: web
    name: dheal-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/